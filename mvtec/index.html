<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wizualizator wad (MVTec AD)</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2c313a; --fg:#e6e8eb; --dim:#8b93a0; --ok:#3ecf6e; --bad:#ef5350; --acc:#5aa9ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,sans-serif; }
  #bar { position:sticky; top:0; z-index:5; display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  select, button { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font:inherit; }
  button.on { border-color:var(--acc); color:var(--acc); }
  #stat { color:var(--dim); margin-left:auto; }
  #grid { padding:12px; display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; }
  .card { background:var(--panel); border:3px solid var(--line); border-radius:8px; overflow:hidden; }
  .card.hit { border-color:var(--ok); } .card.miss { border-color:var(--bad); }
  .imgs { display:flex; } .imgs div { flex:1; position:relative; background:#000; aspect-ratio:1; }
  .imgs img { width:100%; height:100%; object-fit:contain; display:block; }
  .imgs span { position:absolute; left:4px; top:3px; font-size:11px; background:#000a; padding:0 4px; border-radius:3px; }
  .meta { padding:6px 8px; font-size:12px; display:flex; justify-content:space-between; gap:6px; }
  .dim { color:var(--dim); }
  #map { display:none; position:relative; height:calc(100vh - 100px); }
  #cv { width:100%; height:100%; display:block; cursor:grab; }
  #tip { position:absolute; pointer-events:none; display:none; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:4px; font-size:12px; }
  #tip img { display:block; width:140px; }
  #pick { position:absolute; right:12px; top:12px; width:300px; display:none; }
  .thr { grid-column:1/-1; border-top:2px dashed var(--acc); color:var(--acc); text-align:center; padding:4px; font-size:12px; }
</style>
</head>
<body>
<div id="bar">
  <b>MVTec AD</b>
  <select id="cat"></select>
  <button id="vList" class="on">lista</button><button id="vMap">mapa 2D</button>
  <button data-f="all" class="on">wszystkie</button>
  <button data-f="miss">tylko błędy</button>
  <button data-f="missed">przeoczone wady</button>
  <button data-f="false">fałszywe odrzucenia</button>
  <label><input type="checkbox" id="mask" checked> maska wady</label>
  <span id="stat"></span>
</div>
<div id="grid"></div>
<div id="map"><canvas id="cv"></canvas><div id="tip"></div><div id="pick"></div></div>
<script src="data.js"></script>
<script>
const D = window.DEF, sel = document.getElementById("cat"), grid = document.getElementById("grid");
let filter = "all";
Object.keys(D.cats).forEach(c => sel.add(new Option(c, c)));
function render() {
  const c = D.cats[sel.value], thr = c.threshold, showMask = document.getElementById("mask").checked;
  let nMiss = 0, nFalse = 0, nDef = 0, nGood = 0, html = "", drew = false;
  for (const r of c.items) { r.defective ? nDef++ : nGood++; const flagged = r.score > thr;
    if (r.defective && !flagged) nMiss++; if (!r.defective && flagged) nFalse++; }
  for (const r of c.items) {
    const flagged = r.score > thr, ok = flagged === !!r.defective;
    if (filter === "miss" && ok) continue;
    if (filter === "missed" && !(r.defective && !flagged)) continue;
    if (filter === "false" && !(!r.defective && flagged)) continue;
    if (!drew && !flagged && filter === "all") { html += `<div class="thr">próg decyzji ${thr.toFixed(4)} (poniżej: uznane za dobre)</div>`; drew = true; }
    const q = r.mask && showMask ? r.id + "_mask" : r.id;
    html += `<div class="card ${ok ? "hit" : "miss"}"><div class="imgs">
      <div><span>zapytanie</span><img loading="lazy" src="thumbs/${q}.jpg"></div>
      <div><span>najbliższe dobre</span><img loading="lazy" src="thumbs/${r.nn}.jpg"></div></div>
      <div class="meta"><span>${r.defective ? "wada: " + r.type : "dobry"}</span>
      <span class="dim">wynik ${r.score.toFixed(4)} → ${flagged ? "odrzucony" : "przyjęty"}</span></div></div>`;
  }
  grid.innerHTML = html;
  document.getElementById("stat").textContent = `galeria ${c.gallery} | test: ${nGood} dobrych, ${nDef} wadliwych | przeoczone ${nMiss}/${nDef}, fałszywe odrzucenia ${nFalse}/${nGood} | ${D.variant}`;
}
// ---- mapa 2D (t-SNE zbiorczy: galeria + test), przesuwanie, powiększanie, klik pokazuje zdjęcie i jego najbliższe dobre
let view = 'list', T = {s:1, x:0, y:0}, picked = null;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), tip = document.getElementById('tip'), pick = document.getElementById('pick'), mapEl = document.getElementById('map');
function fit() { const r = mapEl.getBoundingClientRect(); cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio; }
const P = (p) => { const m = Math.min(cv.width, cv.height) * 0.92; return [(p[0] - .5) * m * T.s + cv.width / 2 + T.x, (p[1] - .5) * m * T.s + cv.height / 2 + T.y]; };
function shown(r) { // same filters as the list
  const flagged = r.score > D.cats[sel.value].threshold, ok = flagged === !!r.defective;
  return filter === 'all' || (filter === 'miss' && !ok) || (filter === 'missed' && r.defective && !flagged) || (filter === 'false' && !r.defective && flagged);
}
function drawMap() {
  const c = D.cats[sel.value], dpr = devicePixelRatio; ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#6b7280'; ctx.globalAlpha = .7;
  c.gallery_xy.forEach(p => { const [x, y] = P(p); ctx.beginPath(); ctx.arc(x, y, 2.5 * dpr, 0, 7); ctx.fill(); });
  c.items.forEach(r => {
    const [x, y] = P(r.xy), flagged = r.score > c.threshold, ok = flagged === !!r.defective;
    ctx.globalAlpha = shown(r) ? 1 : .12; ctx.fillStyle = r.defective ? '#c084fc' : '#3ecf6e';
    ctx.beginPath(); ctx.arc(x, y, 4 * dpr, 0, 7); ctx.fill();
    if (!ok) { ctx.strokeStyle = '#ef5350'; ctx.lineWidth = 2 * dpr; ctx.beginPath(); ctx.arc(x, y, 7 * dpr, 0, 7); ctx.stroke(); }
  });
  ctx.globalAlpha = 1;
  if (picked !== null) {
    const r = c.items[picked], [x, y] = P(r.xy), [gx, gy] = P(c.gallery_xy[r.nn_g]);
    ctx.strokeStyle = '#5aa9ff'; ctx.lineWidth = 2 * dpr; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(gx, gy); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, 9 * dpr, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(gx, gy, 7 * dpr, 0, 7); ctx.stroke();
  }
}
function nearestPt(ev) {
  const c = D.cats[sel.value], r = cv.getBoundingClientRect(), mx = (ev.clientX - r.left) * devicePixelRatio, my = (ev.clientY - r.top) * devicePixelRatio;
  let best = -1, bd = (10 * devicePixelRatio) ** 2;
  c.items.forEach((it, i) => { const [x, y] = P(it.xy), d = (x - mx) ** 2 + (y - my) ** 2; if (d < bd) { bd = d; best = i; } });
  return best;
}
function showPick(i) {
  picked = i; const c = D.cats[sel.value], r = c.items[i], flagged = r.score > c.threshold, showMask = document.getElementById('mask').checked;
  const q = r.mask && showMask ? r.id + '_mask' : r.id;
  pick.style.display = 'block';
  pick.innerHTML = `<div class="card ${flagged === !!r.defective ? 'hit' : 'miss'}"><div class="imgs" style="flex-direction:column"><div><span>zapytanie</span><img src="thumbs/${q}.jpg"></div><div><span>najbliższe dobre</span><img src="thumbs/${r.nn}.jpg"></div></div><div class="meta"><span>${r.defective ? 'wada: ' + r.type : 'dobry'}</span><span class="dim">wynik ${r.score.toFixed(4)} → ${flagged ? 'odrzucony' : 'przyjęty'}</span></div></div>`;
  drawMap();
}
function setView(v) {
  view = v; document.getElementById('vList').classList.toggle('on', v === 'list'); document.getElementById('vMap').classList.toggle('on', v === 'map');
  grid.style.display = v === 'list' ? 'grid' : 'none'; mapEl.style.display = v === 'map' ? 'block' : 'none';
  if (v === 'map') { fit(); drawMap(); }
}
document.getElementById('vList').onclick = () => setView('list'); document.getElementById('vMap').onclick = () => setView('map');
let drag = null, moved = false;
cv.onmousedown = e => { drag = [e.clientX, e.clientY, T.x, T.y]; moved = false; cv.style.cursor = 'grabbing'; };
window.onmouseup = e => { if (drag && !moved && view === 'map') { const i = nearestPt(e); if (i >= 0) showPick(i); } drag = null; cv.style.cursor = 'grab'; };
cv.onmousemove = e => {
  if (drag) { const dx = e.clientX - drag[0], dy = e.clientY - drag[1]; if (Math.abs(dx) + Math.abs(dy) > 3) moved = true; T.x = drag[2] + dx * devicePixelRatio; T.y = drag[3] + dy * devicePixelRatio; drawMap(); return; }
  const i = nearestPt(e); if (i < 0) { tip.style.display = 'none'; return; }
  const r = D.cats[sel.value].items[i], b = mapEl.getBoundingClientRect();
  tip.style.display = 'block'; tip.style.left = (e.clientX - b.left + 14) + 'px'; tip.style.top = (e.clientY - b.top + 14) + 'px';
  tip.innerHTML = `<img src="thumbs/${r.id}.jpg">${r.defective ? r.type : 'dobry'} · ${r.score.toFixed(3)}`;
};
cv.onmouseleave = () => { tip.style.display = 'none'; };
cv.onwheel = e => {
  e.preventDefault(); const r = cv.getBoundingClientRect(), mx = (e.clientX - r.left) * devicePixelRatio - cv.width / 2, my = (e.clientY - r.top) * devicePixelRatio - cv.height / 2;
  const ns = Math.min(40, Math.max(.5, T.s * (e.deltaY < 0 ? 1.2 : 1 / 1.2))), k = ns / T.s; T.x = mx - (mx - T.x) * k; T.y = my - (my - T.y) * k; T.s = ns; drawMap();
};
window.onresize = () => { if (view === 'map') { fit(); drawMap(); } };
sel.addEventListener('change', () => { picked = null; pick.style.display = 'none'; T = {s:1, x:0, y:0}; if (view === 'map') drawMap(); });
document.getElementById('mask').addEventListener('change', () => { if (picked !== null) showPick(picked); });
sel.onchange = render; document.getElementById("mask").onchange = render;
document.querySelectorAll("button[data-f]").forEach(b => b.onclick = () => {
  document.querySelectorAll("button[data-f]").forEach(x => x.classList.toggle("on", x === b)); filter = b.dataset.f; render(); if (view === 'map') drawMap(); });
render();
</script>
</body>
</html>
